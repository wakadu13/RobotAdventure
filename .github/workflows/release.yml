# Construit Bouclier 2050 pour Linux, Windows, macOS (Apple Silicon) et Android.
# Un tag v* publie une release GitHub avec les quatre paquets ; un lancement manuel
# produit seulement les artefacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RAYLIB_TAG: '5.0'

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make test

  linux:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev zip
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - run: tools/release/build.sh linux "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - run: tools/release/build.sh windows "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - run: tools/release/build.sh macos "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  android:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - name: APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            unset ANDROID_KEYSTORE_PASS
          fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          tools/release/build.sh android "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Bouclier 2050 ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            Paquets :
            - **Windows** : décompressez le zip et lancez `bouclier2050.exe` (SmartScreen : « Informations complémentaires » puis « Exécuter quand même »).
            - **Linux** : `tar xzf` puis `./bouclier2050/bouclier2050` (X11, OpenGL 3.3).
            - **macOS Apple Silicon** : décompressez, puis clic droit sur « Bouclier 2050 » > Ouvrir (application non notarisée).
            - **Android** (arm64, Android 10+) : installez l'APK en autorisant les sources inconnues. Pincez pour zoomer, bouton ORDRE pour déplacer les unités.
