# Construit Bouclier 2050 pour Linux, Windows, macOS (Apple Silicon) et Android.
# Une release GitHub est publiee quand le fichier VERSION change (le tag vX.Y.Z est cree
# par le workflow) ou quand un tag v* est pousse ; un lancement manuel produit seulement
# les artefacts. Les versions avec un tiret (1.0.0-rc.1) sont des preversions.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

env:
  RAYLIB_TAG: '5.0'

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make test

  linux:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else echo "VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"; fi
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev zip
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - run: tools/release/build.sh linux "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else echo "VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"; fi
      - name: MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - run: tools/release/build.sh windows "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else echo "VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"; fi
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - run: tools/release/build.sh macos "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  android:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else echo "VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
      - name: APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            unset ANDROID_KEYSTORE_PASS
          fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          tools/release/build.sh android "$RUNNER_TEMP/raylib"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  release:
    if: github.event_name == 'push'
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bouclier 2050 ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: dist/*
          generate_release_notes: true
          body_path: docs/NOTES_DE_VERSION.md
